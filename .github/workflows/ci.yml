# .github/workflows/ci.yml
# 这是给 GitHub 的"自动化说明书"（流水线）
# 作用：每次有人把代码 push 到 main 分支，GitHub 就自动执行下面的步骤。
# 任何一步失败，GitHub 会标红叉并通知你。

name: CI（自动检查）

on:
  push:                      # 触发条件：推送代码时
    branches: [main]         # 只看 main 分支
  pull_request:              # 提 PR 时也会跑

jobs:
  check:
    runs-on: ubuntu-latest   # 在 GitHub 提供的一台干净 Linux 电脑上跑

    steps:
      # 第 1 步：把代码下载到这台电脑
      - name: 拉取代码
        uses: actions/checkout@v4

      # 第 2 步：装 Python 解释器
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 第 3 步：按"购物清单"安装依赖
      - name: 安装依赖
        run: pip install -r requirements.txt

      # 第 4 步：跑测试（这一步失败就说明代码有问题）
      - name: 运行测试
        run: pytest
